<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCI Freikarten</title>
<meta name="description" content="Monatlicher Zähler für die UCI-Freikarten mit Einlöse-Code.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100d0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #100d0b;
    --ink-2: #1a1512;
    --ink-3: #241d18;
    --cream: #f2ece1;
    --cream-dim: rgba(242, 236, 225, 0.55);
    --cream-faint: rgba(242, 236, 225, 0.28);
    --line: rgba(242, 236, 225, 0.13);
    --gold: #e8a33d;
    --gold-deep: #c77f18;
    --serif: "Fraunces", Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    font-weight: 300;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(env(safe-area-inset-top), 1.2rem) 1.2rem max(env(safe-area-inset-bottom), 1.6rem);
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 26rem; display: flex; flex-direction: column; gap: 1.15rem; }

  header { text-align: center; padding-top: 0.4rem; }
  .eyebrow {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--gold); margin: 0 0 0.4rem;
  }
  h1 {
    font-family: var(--serif); font-weight: 650; font-size: 1.7rem;
    margin: 0; line-height: 1.1; text-wrap: balance;
  }
  .month {
    margin: 0.45rem 0 0; font-size: 0.72rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--cream-dim);
  }

  /* ---- Code-Karte ---- */
  .code-card {
    position: relative;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.05rem 1.1rem 1.15rem;
  }
  .code-card::before, .code-card::after {
    content: ""; position: absolute; top: 50%; width: 22px; height: 22px;
    border-radius: 50%; background: var(--ink); border: 1px solid var(--line);
    transform: translateY(-50%);
  }
  .code-card::before { left: -12px; }
  .code-card::after { right: -12px; }
  .code-label {
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--cream-dim); margin: 0 0 0.5rem;
    text-align: center;
  }
  .code {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: clamp(1.05rem, 5.4vw, 1.3rem);
    font-weight: 500; letter-spacing: 0.14em; text-align: center;
    margin: 0 0 0.85rem; color: var(--cream);
    user-select: all; -webkit-user-select: all;
  }
  .copy-btn {
    display: block; width: 100%;
    padding: 0.85rem 1rem;
    font-family: var(--sans); font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: #17110a;
    background: linear-gradient(110deg, var(--gold) 0%, var(--gold-deep) 100%);
    border: none; border-radius: 10px; cursor: pointer;
    transition: transform 0.12s ease, filter 0.2s ease;
  }
  .copy-btn:active { transform: scale(0.975); }
  .copy-btn.is-copied { filter: saturate(0.4) brightness(1.1); }

  /* ---- Ticket-Stubs ---- */
  .stubs {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.55rem;
    padding: 0; margin: 0; list-style: none;
  }
  .stub {
    position: relative;
    aspect-ratio: 3 / 4;
    border: 1px dashed var(--cream-faint);
    border-radius: 9px;
    background: var(--ink-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.15rem;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.25s ease, transform 0.12s ease;
    padding: 0; font-family: var(--sans);
    perspective: 300px;
  }
  .stub:active { transform: scale(0.94); }
  .stub .num {
    font-size: 0.58rem; font-weight: 500; letter-spacing: 0.08em;
    color: var(--cream-faint);
  }
  .stub .mark {
    font-family: var(--serif); font-size: 1.25rem; line-height: 1;
    color: transparent; transform: scale(0.4);
    transition: color 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* Stanzloch oben — erscheint beim Einlösen */
  .stub .hole {
    position: absolute; top: 6px; left: 50%;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink);
    border: 1px solid transparent;
    transform: translateX(-50%) scale(0);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease;
  }
  .stub.is-used {
    border-style: solid; border-color: var(--gold);
    background: linear-gradient(150deg, rgba(232, 163, 61, 0.16), rgba(199, 127, 24, 0.05));
  }
  .stub.is-used .mark { color: var(--gold); transform: scale(1); }
  .stub.is-used .num { color: var(--cream-dim); }
  .stub.is-used .hole { transform: translateX(-50%) scale(1); border-color: var(--gold); }

  /* Abriss-Animation beim frischen Einlösen */
  @keyframes punch {
    0%   { transform: rotate(0deg) scale(1); }
    30%  { transform: rotate(-7deg) scale(1.12); }
    55%  { transform: rotate(5deg) scale(1.05); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .stub.just-punched { animation: punch 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* Konfetti-Schnipsel */
  .bit {
    position: fixed; z-index: 90;
    width: 7px; height: 11px; border-radius: 2px;
    pointer-events: none;
    will-change: transform, opacity;
  }

  /* Fliegendes Ticket vom Button zum Stub */
  .fly-ticket {
    position: fixed; z-index: 95;
    width: 34px; height: 22px;
    background: linear-gradient(110deg, var(--gold), var(--gold-deep));
    border-radius: 4px;
    pointer-events: none;
    will-change: transform, opacity;
    box-shadow: 0 4px 14px rgba(232, 163, 61, 0.4);
  }
  .fly-ticket::before {
    content: ""; position: absolute; inset: 3px;
    border: 1px dashed rgba(23, 17, 10, 0.55); border-radius: 2px;
  }

  /* ---- Zähler + Hauptbutton ---- */
  .count-row { text-align: center; margin-top: 0.15rem; }
  .count {
    font-family: var(--serif); font-weight: 650;
    font-size: 2.6rem; line-height: 1; margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .count small { font-size: 1.05rem; font-weight: 500; color: var(--cream-dim); }
  .count-hint { margin: 0.3rem 0 0; font-size: 0.72rem; color: var(--cream-dim); letter-spacing: 0.05em; }

  .punch-btn {
    width: 100%;
    padding: 1.15rem 1rem;
    font-family: var(--serif); font-size: 1.12rem; font-weight: 650;
    color: var(--cream);
    background: var(--ink-3);
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.2s ease, opacity 0.2s ease;
  }
  .punch-btn:active { transform: scale(0.98); }
  .punch-btn:disabled { opacity: 0.35; cursor: default; }
  .punch-btn span { color: var(--gold); }

  footer {
    margin-top: auto; padding-top: 1.4rem;
    font-size: 0.62rem; letter-spacing: 0.1em; color: var(--cream-faint);
    text-align: center; line-height: 1.8;
  }
  .sync-dot { color: var(--gold); }

  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .bit, .fly-ticket { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">UCI Freikarten</p>
    <h1>Kino-Code einlösen</h1>
    <p class="month" data-month></p>
  </header>

  <section class="code-card" aria-label="Freikarten-Code">
    <p class="code-label">Unser Code</p>
    <p class="code" data-code>T23A63QT4U6YV</p>
    <button class="copy-btn" data-copy>Code kopieren</button>
  </section>

  <ul class="stubs" data-stubs aria-label="Eingelöste Freikarten"></ul>

  <div class="count-row">
    <p class="count"><span data-count>0</span><small> / 10 eingelöst</small></p>
    <p class="count-hint">Tipp auf eine Karte, um einen Haken zurückzunehmen.</p>
  </div>

  <button class="punch-btn" data-punch>Freikarte einlösen <span>+</span></button>

  <footer>
    Setzt sich am Monatsanfang automatisch zurück.<br>
    <span data-sync>Verbinde …</span>
  </footer>
</div>

<script>
(function () {
  var CODE = "T23A63QT4U6YV";
  var MAX = 10;
  var KEY = "uci-freikarten";
  var API = "https://shiny-setter-795.eu-west-1.convex.site/freikarten";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function monthKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }

  function effective(data) {
    if (!data || data.month !== monthKey()) return { month: monthKey(), used: 0 };
    return { month: data.month, used: Math.min(MAX, Math.max(0, data.used | 0)) };
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(KEY);
      return effective(raw ? JSON.parse(raw) : null);
    } catch (e) { return { month: monthKey(), used: 0 }; }
  }
  function saveLocal(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = loadLocal();
  var online = false;

  var stubsEl = document.querySelector("[data-stubs]");
  var countEl = document.querySelector("[data-count]");
  var punchBtn = document.querySelector("[data-punch]");
  var copyBtn = document.querySelector("[data-copy]");
  var monthEl = document.querySelector("[data-month]");
  var syncEl = document.querySelector("[data-sync]");

  var monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  function renderMonth() {
    var d = new Date();
    monthEl.textContent = monthNames[d.getMonth()] + " " + d.getFullYear();
  }
  renderMonth();

  for (var i = 0; i < MAX; i++) {
    var li = document.createElement("li");
    li.innerHTML = '<button class="stub" type="button" aria-pressed="false">' +
      '<span class="hole" aria-hidden="true"></span>' +
      '<span class="mark" aria-hidden="true">✓</span>' +
      '<span class="num">' + (i + 1) + '</span></button>';
    stubsEl.appendChild(li);
  }
  var stubBtns = Array.prototype.slice.call(stubsEl.querySelectorAll(".stub"));

  function render() {
    stubBtns.forEach(function (btn, i) {
      var used = i < state.used;
      btn.classList.toggle("is-used", used);
      btn.setAttribute("aria-pressed", used ? "true" : "false");
      btn.setAttribute("aria-label", "Freikarte " + (i + 1) + (used ? " (eingelöst)" : " (frei)"));
    });
    countEl.textContent = state.used;
    punchBtn.disabled = state.used >= MAX;
    punchBtn.innerHTML = state.used >= MAX
      ? "Alle 10 eingelöst 🎉"
      : 'Freikarte einlösen <span>+</span>';
  }

  function setSync(text, ok) {
    syncEl.innerHTML = ok ? '<span class="sync-dot">●</span> ' + text : text;
  }

  // ---- Animationen ----
  function confettiAt(x, y) {
    if (reduceMotion) return;
    var colors = ["#e8a33d", "#c77f18", "#f2ece1", "#fe5e2e"];
    for (var i = 0; i < 14; i++) {
      var b = document.createElement("div");
      b.className = "bit";
      b.style.background = colors[i % colors.length];
      b.style.left = x + "px";
      b.style.top = y + "px";
      document.body.appendChild(b);
      var ang = Math.random() * Math.PI * 2;
      var dist = 40 + Math.random() * 70;
      var dx = Math.cos(ang) * dist;
      var dy = Math.sin(ang) * dist - 30;
      var rot = (Math.random() - 0.5) * 540;
      b.animate([
        { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + dx + "px," + (dy + 80) + "px) rotate(" + rot + "deg)", opacity: 0 }
      ], { duration: 700 + Math.random() * 300, easing: "cubic-bezier(0.2,0.6,0.3,1)" })
       .onfinish = function () { this.effect.target.remove(); };
    }
  }

  function flyTicket(fromEl, toEl, done) {
    if (reduceMotion) { done(); return; }
    var f = fromEl.getBoundingClientRect();
    var t = toEl.getBoundingClientRect();
    var tk = document.createElement("div");
    tk.className = "fly-ticket";
    var sx = f.left + f.width / 2 - 17;
    var sy = f.top + f.height / 2 - 11;
    var ex = t.left + t.width / 2 - 17;
    var ey = t.top + t.height / 2 - 11;
    tk.style.left = sx + "px";
    tk.style.top = sy + "px";
    document.body.appendChild(tk);
    tk.animate([
      { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1 },
      { transform: "translate(" + (ex - sx) * 0.5 + "px," + ((ey - sy) * 0.5 - 46) + "px) rotate(180deg) scale(1.08)", opacity: 1, offset: 0.55 },
      { transform: "translate(" + (ex - sx) + "px," + (ey - sy) + "px) rotate(340deg) scale(0.55)", opacity: 0.9 }
    ], { duration: 520, easing: "cubic-bezier(0.3,0.6,0.3,1)" }).onfinish = function () {
      tk.remove();
      done();
    };
  }

  function punchStub(i) {
    var btn = stubBtns[i];
    if (!btn) return;
    btn.classList.remove("just-punched");
    void btn.offsetWidth; // Animation neu starten
    btn.classList.add("just-punched");
    var r = btn.getBoundingClientRect();
    confettiAt(r.left + r.width / 2, r.top + r.height / 2);
  }

  // ---- Persistenz: Convex-Backend + lokaler Fallback ----
  function persist(newUsed, animateIndex) {
    var prev = state.used;
    state = { month: monthKey(), used: Math.min(MAX, Math.max(0, newUsed)) };
    saveLocal(state);
    render();
    if (animateIndex !== undefined && state.used > prev) punchStub(animateIndex);
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ month: state.month, used: state.used })
    }).then(function () {
      online = true;
      setSync("Synct für alle mit diesem Link.", true);
    }).catch(function () {
      online = false;
      setSync("Offline — wird beim nächsten Öffnen abgeglichen.");
    });
  }

  function pull() {
    fetch(API).then(function (r) { return r.json(); }).then(function (data) {
      online = true;
      var remote = effective(data);
      // Nur übernehmen, wenn der Server wirklich etwas hat; sonst lokalen Stand hochschieben.
      if (data === null && state.used > 0) {
        persist(state.used);
        return;
      }
      if (remote.used !== state.used || remote.month !== state.month) {
        state = remote;
        saveLocal(state);
        renderMonth();
        render();
      }
      setSync("Synct für alle mit diesem Link.", true);
    }).catch(function () {
      online = false;
      setSync("Offline — lokaler Stand.");
    });
  }

  function refreshMonth() {
    var e = effective(state);
    if (e.used !== state.used || e.month !== state.month) {
      state = e;
      saveLocal(state);
      renderMonth();
      render();
    }
  }

  punchBtn.addEventListener("click", function () {
    refreshMonth();
    if (state.used >= MAX) return;
    var idx = state.used; // der Stub, der gleich abgehakt wird
    flyTicket(punchBtn, stubBtns[idx], function () {
      persist(idx + 1, idx);
    });
  });

  stubBtns.forEach(function (btn, i) {
    btn.addEventListener("click", function () {
      refreshMonth();
      var target = i < state.used ? i : i + 1;
      var adding = target > state.used;
      persist(target, adding ? target - 1 : undefined);
    });
  });

  copyBtn.addEventListener("click", function () {
    function done() {
      copyBtn.classList.add("is-copied");
      copyBtn.textContent = "Kopiert ✓";
      setTimeout(function () {
        copyBtn.classList.remove("is-copied");
        copyBtn.textContent = "Code kopieren";
      }, 1800);
    }
    function fallback() {
      var r = document.createRange();
      r.selectNodeContents(document.querySelector("[data-code]"));
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      try { document.execCommand("copy"); done(); } catch (e) {}
      sel.removeAllRanges();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CODE).then(done, fallback);
    } else { fallback(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { refreshMonth(); pull(); }
  });
  setInterval(function () {
    if (!document.hidden) pull();
  }, 25000);

  render();
  pull();
})();
</script>
</body>
</html>
